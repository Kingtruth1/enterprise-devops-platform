services:

  nginx:
    image: nginx:latest

    container_name: enterprise-nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

  frontend:

    build:
      context: ./frontend

    container_name: enterprise-frontend

    ports:
      - "3000:3000"

    environment:
      CHOKIDAR_USEPOLLING: "true"

    depends_on:
      - backend

  backend:

    build:
      context: ./backend

    container_name: enterprise-backend

    ports:
      - "3001:3001"

    env_file:
      - ./backend/.env

    depends_on:
      - postgres

  postgres:

    image: postgres:16

    container_name: enterprise-db

    restart: unless-stopped

    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: enterprise

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: