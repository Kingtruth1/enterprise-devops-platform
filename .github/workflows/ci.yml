name: Enterprise DevOps CI

on:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4

        with:
          node-version: 22

      - name: Install Backend
        working-directory: backend
        run: npm install

      - name: Install Frontend
        working-directory: frontend
        run: npm install

      - name: Build Backend Docker
        run: |
          docker build \
          -t enterprise-backend \
          ./backend

      - name: Build Frontend Docker
        run: |
          docker build \
          -t enterprise-frontend \
          ./frontend

      - name: Run Backend Test
        working-directory: backend
        run: node test.js
